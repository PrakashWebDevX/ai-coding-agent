[project]
name = "ai-coding-practice-agent"
version = "1.0.0"
description = "AI Coding Practice Browser Agent - LangGraph + Playwright + FastAPI + Streamlit"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "langgraph>=0.2.45",
    "langchain-core>=0.3.15",
    "litellm>=1.52.0",
    "playwright>=1.48.0",
    "streamlit>=1.39.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",
    "chromadb>=0.5.18",
    "redis>=5.2.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "rich>=13.9.4",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.2",
    "streamlit-ace>=0.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "playwright>=1.48.0",
    "ruff>=0.7.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
